name: Build Debian Package
on: [push]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run:  |
          ./install/install_dependencies.sh
          pip install pyinstaller -r requirements.t
        
      - name: Build Binary
        run: pyinstaller --onefile src/pcapdecoder.py
