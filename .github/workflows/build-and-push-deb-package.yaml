name: Build Debian Package
on: [push]

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run:  |
          ./install/install_dependencies.sh
          pip install pyinstaller
        
      - name: Build Binary
        run: pyinstaller --onefile src/pcapdecoder.py --name "pcap_decoder"
      - name: Prepare .deb Structure
        run: |
          mkdir -p deb-package/usr/local/bin
          mkdir -p deb-package/DEBIAN
          ls
          ls dist/
          cp dist/pcap_decoder deb-package/usr/local/bin/
          
          echo "Package: my-app
          Version: 1.0.0
          Section: base
          Priority: optional
          Architecture: amd64
          Maintainer: You <you@example.com>
          Description: Standalone python app" > deb-package/DEBIAN/control
          
      - name: Build Debian Package
        run: dpkg-deb --build deb-package my-app.deb
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: my-app.deb
